<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Legacy Vault - Asset Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // Initial Mock Data or LocalStorage
            const [assets, setAssets] = useState(() => {
                const saved = localStorage.getItem('family_vault_assets');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { }
                }
                return [
                    { id: 1, name: "Toyota Voxy Hybrid 2015", category: "Kendaraan", value: 285000000, ownership: "Bersama", location: "Garasi Rumah", notes: "BPKB lengkap atas nama sendiri", file: "bpkd_voxy.pdf" },
                    { id: 2, name: "Rumah Tinggal Takatsuki", category: "Properti", value: 3500000000, ownership: "Bersama", location: "Osaka Prefecture", notes: "Sertifikat hak milik utama", file: "sertifikat_rumah.pdf" },
                    { id: 3, name: "Tabungan Mizuho Bank", category: "Rekening Bank", value: 125000000, ownership: "Suami", location: "Mizuho Bank Takatsuki", notes: "Rekening gaji utama", file: "mizuho_book.pdf" },
                    { id: 4, name: "Logam Mulia Antam 50gr", category: "Logam Mulia", value: 65000000, ownership: "Istri", location: "Brankas Rumah", notes: "Sertifikat ANTAM resmi", file: "sertifikat_emas.jpg" },
                    { id: 5, name: "Tabungan Masa Depan Anak", category: "Rekening Bank", value: 45000000, ownership: "Anak", location: "JP Post Bank", notes: "Untuk tabungan pendidikan Zayuna", file: "yucho_book.pdf" }
                ];
            });

            const [filterCategory, setFilterCategory] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");
            const [isPrivacyMasked, setIsPrivacyMasked] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingAsset, setEditingAsset] = useState(null);

            // Form State
            const [formData, setFormData] = useState({
                name: "",
                category: "Properti",
                value: "",
                ownership: "Suami",
                location: "",
                notes: "",
                file: ""
            });

            useEffect(() => {
                localStorage.setItem('family_vault_assets', JSON.stringify(assets));
            }, [assets]);

            const categories = ["All", "Properti", "Kendaraan", "Rekening Bank", "Investasi", "Logam Mulia"];

            const filteredAssets = useMemo(() => {
                return assets.filter(item => {
                    const matchesCategory = filterCategory === "All" || item.category === filterCategory;
                    const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          item.location.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [assets, filterCategory, searchQuery]);

            const totalNetWorth = useMemo(() => {
                return assets.reduce((sum, item) => sum + Number(item.value || 0), 0);
            }, [assets]);

            const formatIDR = (val) => {
                if (isPrivacyMasked) return "Rp ******";
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
            };

            const getOwnershipBadge = (ownership) => {
                switch(ownership) {
                    case 'Bersama': return 'bg-blue-100 text-blue-700 border-blue-200';
                    case 'Suami': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    case 'Istri': return 'bg-purple-100 text-purple-700 border-purple-200';
                    case 'Anak': return 'bg-amber-100 text-amber-700 border-amber-200';
                    default: return 'bg-slate-100 text-slate-700 border-slate-200';
                }
            };

            const handleOpenModal = (asset = null) => {
                if (asset) {
                    setEditingAsset(asset);
                    setFormData(asset);
                } else {
                    setEditingAsset(null);
                    setFormData({ name: "", category: "Properti", value: "", ownership: "Suami", location: "", notes: "", file: "" });
                }
                setIsModalOpen(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.value) return;

                if (editingAsset) {
                    setAssets(assets.map(item => item.id === editingAsset.id ? { ...formData, id: item.id, value: Number(formData.value) } : item));
                } else {
                    const newAsset = { ...formData, id: Date.now(), value: Number(formData.value) };
                    setAssets([newAsset, ...assets]);
                }
                setIsModalOpen(false);
            };

            const handleDelete = (id) => {
                if (confirm("Yakin ingin menghapus aset ini dari vault?")) {
                    setAssets(assets.filter(item => item.id !== id));
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(assets, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "family_legacy_vault_backup.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8">
                    {/* Header & Privacy Toggle */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="bg-indigo-600 text-white p-2 rounded-xl">🛡️</span>
                                <h1 className="text-2xl font-bold text-slate-900">Family Legacy Vault</h1>
                            </div>
                            <p className="text-sm text-slate-500 mt-1">Modul Manajemen Aset Keluarga & Kekayaan Bersih</p>
                        </div>

                        <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                            <button 
                                onClick={() => setIsPrivacyMasked(!isPrivacyMasked)}
                                className={`px-4 py-2 rounded-xl text-sm font-medium border transition flex items-center gap-2 ${isPrivacyMasked ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                            >
                                {isPrivacyMasked ? '👁️ Tampilkan Nilai' : '🔒 Sembunyikan Nilai'}
                            </button>

                            <button 
                                onClick={exportData}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition"
                                title="Backup data ke file JSON"
                            >
                                💾 Backup
                            </button>
                        </div>
                    </header>

                    {/* Asset Summary Header Card */}
                    <div className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white rounded-3xl p-6 md:p-8 shadow-xl mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <span className="text-indigo-300 text-sm font-medium uppercase tracking-wider">Total Estimated Net Worth</span>
                            <div className="text-3xl md:text-5xl font-extrabold mt-1 tracking-tight">
                                {formatIDR(totalNetWorth)}
                            </div>
                            <p className="text-indigo-200 text-xs mt-2">Akumulasi dari {assets.length} aset terdaftar</p>
                        </div>
                        <button 
                            onClick={() => handleOpenModal()}
                            className="w-full md:w-auto bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg transition flex items-center justify-center gap-2"
                        >
                            ➕ Tambah Aset Baru
                        </button>
                    </div>

                    {/* Filter & Search Controls */}
                    <div className="flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-4 mb-6">
                        {/* Filter Tabs */}
                        <div className="flex items-center gap-2 overflow-x-auto pb-2 lg:pb-0 scrollbar-none">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setFilterCategory(cat)}
                                    className={`px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition ${filterCategory === cat ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* Search Bar */}
                        <div className="relative w-full lg:w-72">
                            <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔍</span>
                            <input 
                                type="text"
                                placeholder="Cari nama aset atau lokasi..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                    </div>

                    {/* Asset Table / Grid */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        {filteredAssets.length === 0 ? (
                            <div className="text-center py-16 text-slate-400">
                                <p className="text-lg">Tidak ada aset yang ditemukan.</p>
                                <p className="text-sm mt-1">Coba ubah kata kunci pencarian atau kategori.</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                            <th className="py-4 px-6">Nama Aset</th>
                                            <th className="py-4 px-6">Kategori</th>
                                            <th className="py-4 px-6">Estimasi Nilai</th>
                                            <th className="py-4 px-6">Kepemilikan</th>
                                            <th className="py-4 px-6">Lokasi / Catatan</th>
                                            <th className="py-4 px-6 text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {filteredAssets.map(item => (
                                            <tr key={item.id} className="hover:bg-slate-50/80 transition">
                                                <td className="py-4 px-6 font-medium text-slate-900">
                                                    {item.name}
                                                    {item.file && <span className="block text-xs text-indigo-600 font-normal mt-0.5">📄 {item.file}</span>}
                                                </td>
                                                <td className="py-4 px-6">
                                                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-medium">
                                                        {item.category}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-6 font-semibold text-slate-900">
                                                    {formatIDR(item.value)}
                                                </td>
                                                <td className="py-4 px-6">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${getOwnershipBadge(item.ownership)}`}>
                                                        {item.ownership}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-6 text-slate-500">
                                                    <div className="font-medium text-slate-700">{item.location || '-'}</div>
                                                    <div className="text-xs text-slate-400 truncate max-w-xs">{item.notes}</div>
                                                </td>
                                                <td className="py-4 px-6 text-right space-x-2">
                                                    <button 
                                                        onClick={() => handleOpenModal(item)}
                                                        className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition"
                                                    >
                                                        Edit
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDelete(item.id)}
                                                        className="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-medium transition"
                                                    >
                                                        Hapus
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* Modal Add/Edit */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-slate-900">
                                        {editingAsset ? 'Edit Aset' : 'Tambah Aset Baru'}
                                    </h2>
                                    <button 
                                        onClick={() => setIsModalOpen(false)}
                                        className="text-slate-400 hover:text-slate-600 font-bold text-xl"
                                    >
                                        &times;
                                    </button>
                                </div>

                                <form onSubmit={handleSave} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Aset</label>
                                        <input 
                                            type="text"
                                            required
                                            placeholder="Contoh: Toyota Voxy / Tanah Osaka"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori</label>
                                            <select 
                                                value={formData.category}
                                                onChange={(e) => setFormData({...formData, category: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            >
                                                <option value="Properti">Properti</option>
                                                <option value="Kendaraan">Kendaraan</option>
                                                <option value="Rekening Bank">Rekening Bank</option>
                                                <option value="Investasi">Investasi</option>
                                                <option value="Logam Mulia">Logam Mulia</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Kepemilikan</label>
                                            <select 
                                                value={formData.ownership}
                                                onChange={(e) => setFormData({...formData, ownership: e.target.value})}
                                                className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            >
                                                <option value="Suami">Suami</option>
                                                <option value="Istri">Istri</option>
                                                <option value="Bersama">Bersama</option>
                                                <option value="Anak">Anak</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Estimasi Nilai (IDR / JPY)</label>
                                        <input 
                                            type="number"
                                            required
                                            placeholder="Contoh: 150000000"
                                            value={formData.value}
                                            onChange={(e) => setFormData({...formData, value: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Lokasi / Bank</label>
                                        <input 
                                            type="text"
                                            placeholder="Contoh: Mizuho Bank / Garasi"
                                            value={formData.location}
                                            onChange={(e) => setFormData({...formData, location: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Catatan / Deskripsi</label>
                                        <textarea 
                                            rows="2"
                                            placeholder="Nomor polis, nomor BPKB, dll."
                                            value={formData.notes}
                                            onChange={(e) => setFormData({...formData, notes: e.target.value})}
                                            className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        ></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Unggah Dokumen (Sertifikat / BPKB)</label>
                                        <input 
                                            type="file"
                                            onChange={(e) => setFormData({...formData, file: e.target.files[0] ? e.target.files[0].name : formData.file})}
                                            className="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
                                        />
                                        {formData.file && <p className="text-xs text-slate-500 mt-1">File terpilih: {typeof formData.file === 'string' ? formData.file : formData.file.name}</p>}
                                    </div>

                                    <div className="flex justify-end gap-3 pt-4">
                                        <button 
                                            type="button"
                                            onClick={() => setIsModalOpen(false)}
                                            className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-lg transition"
                                        >
                                            Simpan Aset
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
